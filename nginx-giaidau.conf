# Đặt tại /etc/nginx/sites-available/giaidau.namprojects.site.
# File được include trong http {} qua sites-enabled (Ubuntu mặc định).
map $http_upgrade $giaidau_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name giaidau.namprojects.site;

    client_max_body_size 20M;

    access_log /var/log/nginx/giaidau.access.log;
    error_log /var/log/nginx/giaidau.error.log;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $giaidau_connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }
}

# Bật HTTPS bằng Certbot trước khi sử dụng đăng nhập production.
# Cookie session production có Secure, không dùng đăng nhập qua HTTP thuần.
